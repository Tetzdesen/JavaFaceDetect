spring:
  application:
    name: javafacedetect
  datasource:
    url: jdbc:h2:file:./data/javafacedetect;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

face-recognition:
  confidence-threshold: 80.0
  max-image-size-bytes: 5242880
